name: CI

on:
  push:
    branches:
      - master
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build package
        run: npm run build
      - name: Verify npm package contents
        run: npm run check:package
      - name: Type-check source
        run: npx tsc --noEmit -p tsconfig.json
      - name: Type-check tests
        run: npx tsc --noEmit -p tsconfig.test.json
      - name: Type-check demo
        run: npm run check:demo
      - name: Build demo
        run: npm run build:demo
      - name: Verify demo output
        run: test -s dist-demo/index.html && test -d dist-demo/assets
