name: Refresh dependency lockfile

on:
  push:
    branches:
      - v2.1.0

concurrency:
  group: dependency-lock-v2.1.0
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync with latest branch commit
        run: |
          git fetch origin v2.1.0
          git reset --hard origin/v2.1.0
      - name: Regenerate lockfile from the manifest
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile changes
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "The lockfile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh lockfile [skip ci]"
          git push origin HEAD:v2.1.0
